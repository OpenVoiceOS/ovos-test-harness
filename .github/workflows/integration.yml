name: integration

# Cross-repo spec-conformance integration run. Installs the stack listed in
# requirements.txt and runs the full spec conformance suite against it.
#
# requirements.txt is NOT a lockfile: most entries are git refs that track a
# moving branch, so two runs a day apart can install different code. The
# `pip freeze` artifact below records what a given run actually installed, so
# a red run can be reproduced and diffed afterwards.
#
# This repo deliberately does NOT use the shared gh-automations ovoscope
# reusable workflow: it installs its own explicit stack combination.

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps (padatious needs swig + libfann)
        run: sudo apt-get update && sudo apt-get install -y swig libfann-dev

      - name: Install the stack under test
        run: |
          # No unpinned `pip install --upgrade pip` here: an unbounded pip
          # upgrade is itself a moving dependency, defeating the point of a
          # pinned requirements.txt. Use the pip actions/setup-python ships.
          # --pre: requirements.txt's ovoscope floor has no non-prerelease
          # release that satisfies it (every ovoscope release at or above the
          # floor is an alpha), so prereleases must be explicitly allowed.
          pip install --pre -r requirements.txt
          pip install pytest-timeout
          # ovos-media (the OVOS-OCP-1 Virtual Media Player) is installed
          # here rather than from requirements.txt so its floor sits next to
          # the note explaining it. WITH its dependencies: it needs dbus_next,
          # json-database and ovos-plugin-manager to import at all, and a
          # --no-deps install left ovos_media unimportable, which the OCP
          # suites then silently skipped over. The >=2.0.1a1 floor is the
          # release whose bus edge (ovos_media/bus/api.py) the
          # test/backcompat/test_ocp_common_play.py wire cells drive.
          pip install "ovos-media>=2.0.1a1"

      - name: Record the installed stack
        run: pip freeze > stack-freeze.txt

      - name: Upload the installed-stack freeze
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-freeze
          path: stack-freeze.txt

      - name: Run conformance suite
        env:
          # the full stack is installed here, so a suite that collects zero
          # tests is an install failure, not a local convenience skip
          OVOS_CONFORMANCE_EXPECT_FULL: "1"
          # this is the job that installs ovos-media, so it is the job that
          # runs test/backcompat/test_ocp_common_play.py. With the var set
          # those cells never skip: a broken ovos-media install fails them.
          OCP_WIRE_CELLS: "1"
        run: >-
          pytest test/ -v --tb=short -rxX
          --ignore=test/skills_fleet
          --timeout=180 --timeout-method=thread
