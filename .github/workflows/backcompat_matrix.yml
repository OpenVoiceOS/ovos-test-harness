name: mixed-version back-compat matrix

# The companion to `integration.yml`, for the class of bug that workflow cannot
# see. `integration.yml` installs ONE stack from requirements.txt, and pip
# installs one package per name — the harness's documented single-ref-per-repo
# limitation. A skill container frozen months ago talking to a current core is
# two package sets at once, so it needs two venvs and a real websocket.
#
# Four skill/core combinations, one matrix entry each, all sharing the one
# parameterized script in `test/backcompat/`. Pins and reasoning live in
# `test/backcompat/build_venvs.sh` and the suite's module docstring.
#
# Alongside the boundary-pin cells there are four channel cells
# (stable-skill/dev-core, dev-skill/stable-core, testing-skill/dev-core,
# dev-skill/testing-core) built from the OVOS distro's own constraint
# files, fetched fresh at build time. Those track the fleet rather than a
# boundary: a distro pin bump past a behavior boundary flips one of these
# red at that exact moment.
#
# The `old-skill/new-core` cell is expected to xfail until ovos-bus-client#271
# releases. It is `strict=True`, so the day the fix ships this job goes RED
# with an XPASS. That is the intended signal: drop the marker and the cell
# becomes a permanent guard.

on:
  pull_request:
    paths:
      - 'test/backcompat/**'
      - '.github/workflows/backcompat_matrix.yml'
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `skill`/`core` are the venv-name arguments passed to
          # build_venvs.sh, and also which subdirectory of $RUNNER_TEMP/venvs
          # each one lands in: boundary venvs (venv_*_old/new) build directly
          # under $RUNNER_TEMP/venvs, channel venvs (venv_*_stable/testing)
          # build under $RUNNER_TEMP/venvs/channel — see build_venvs.sh's
          # header for why. `skill_dir`/`core_dir` spell out that path per
          # cell so the later steps don't need to re-derive it.
          - combo: old-skill/old-core
            skill: venv_skill_old
            core: venv_core_old
            skill_dir: venvs
            core_dir: venvs
          - combo: old-skill/new-core
            skill: venv_skill_old
            core: venv_core_new
            skill_dir: venvs
            core_dir: venvs
          - combo: new-skill/old-core
            skill: venv_skill_new
            core: venv_core_old
            skill_dir: venvs
            core_dir: venvs
          - combo: new-skill/new-core
            skill: venv_skill_new
            core: venv_core_new
            skill_dir: venvs
            core_dir: venvs
          # channel cells: one side pinned by a live OVOS distro constraints
          # file (fetched fresh in build_venvs.sh), the other at dev. These
          # verify the fleet, not a boundary — see test_mixed_version_matrix.py.
          - combo: stable-skill/dev-core
            skill: venv_skill_stable
            core: venv_core_new
            skill_dir: venvs/channel
            core_dir: venvs
          - combo: dev-skill/stable-core
            skill: venv_skill_new
            core: venv_core_stable
            skill_dir: venvs
            core_dir: venvs/channel
          - combo: testing-skill/dev-core
            skill: venv_skill_testing
            core: venv_core_new
            skill_dir: venvs/channel
            core_dir: venvs
          - combo: dev-skill/testing-core
            skill: venv_skill_new
            core: venv_core_testing
            skill_dir: venvs
            core_dir: venvs/channel
    name: ${{ matrix.combo }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (padatious needs swig + libfann)
        run: sudo apt-get update && sudo apt-get install -y swig libfann-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build this cell's venvs
        env:
          BACKCOMPAT_PYTHON: "3.11"
        run: |
          chmod +x test/backcompat/build_venvs.sh
          test/backcompat/build_venvs.sh "$RUNNER_TEMP/venvs" "${{ matrix.skill }}" "${{ matrix.core }}"

      - name: Record the resolved versions
        run: |
          # Glob both the boundary dir and the channel subdir rather than
          # naming venvs, so a new cell (or a renamed one) is picked up here
          # automatically. Each job only ever has its own one or two venvs
          # present, since build_venvs.sh is now called with explicit names.
          for v in "$RUNNER_TEMP"/venvs/*/ "$RUNNER_TEMP"/venvs/channel/*/; do
            [ -d "$v" ] || continue
            name="$(basename "$v")"
            [ "$name" = "channel" ] && continue
            echo "== $name"
            "$v/bin/python" -m pip freeze 2>/dev/null || true
          done | tee venv-freeze.txt

      - name: Upload the resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venv-freeze-${{ strategy.job-index }}
          path: venv-freeze.txt

      # Channel cells only produce these, but the glob is harmless for the
      # boundary-pin cells. Kept so a red channel cell can be traced back to
      # exactly what the distro pinned that day.
      - name: Upload the fetched constraints files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constraints-${{ strategy.job-index }}
          path: ${{ runner.temp }}/venvs/channel/*.constraints.txt
          if-no-files-found: ignore

      - name: Run the combo
        env:
          BACKCOMPAT_COMBO: ${{ matrix.combo }}
        run: |
          export BACKCOMPAT_SKILL_PYTHON="$RUNNER_TEMP/${{ matrix.skill_dir }}/${{ matrix.skill }}/bin/python"
          "$RUNNER_TEMP/${{ matrix.core_dir }}/${{ matrix.core }}/bin/pytest" \
            test/backcompat/ -v --tb=short -rxX \
            --timeout=300 --timeout-method=thread
