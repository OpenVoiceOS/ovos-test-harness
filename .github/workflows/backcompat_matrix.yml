name: mixed-version back-compat matrix

# The companion to `integration.yml`, for the class of bug that workflow cannot
# see. `integration.yml` installs ONE stack from requirements.txt, and pip
# installs one package per name — the harness's documented single-ref-per-repo
# limitation. A skill container frozen months ago talking to a current core is
# two package sets at once, so it needs two venvs and a real websocket.
#
# Skill/core/matcher combinations, one matrix entry each, all sharing the one
# parameterized script in `test/backcompat/`. Pins and reasoning live in
# `test/backcompat/build_venvs.sh` and the suite's module docstring.
#
# The matcher (M) axis is crossed against the core (C) axis: ovos-core names
# neither ovos-padatious nor ovos-adapt-parser as a runtime dependency, so a
# deployer installs whichever vintage they like on either core. That makes
# old-matcher/new-core and new-matcher/old-core real deployments, and it is
# what lets a red cell be blamed on the matcher plugin instead of on core.
#
# Alongside the boundary-pin cells there are four channel cells
# (stable-skill/dev-core, dev-skill/stable-core, testing-skill/dev-core,
# dev-skill/testing-core) built from the OVOS distro's own constraint
# files, fetched fresh at build time. Those track the fleet rather than a
# boundary: a distro pin bump past a behavior boundary flips one of these
# red at that exact moment.
#
# The `old-skill/new-core` cell is expected to xfail until ovos-bus-client#271
# releases. It is `strict=True`, so the day the fix ships this job goes RED
# with an XPASS. That is the intended signal: drop the marker and the cell
# becomes a permanent guard.
#
# T2.7 trigger split (design §3.2). Cell inventory as of this change: 10
# boundary cells (4 original S/C aliases + 6 matcher/skew cells added by
# #33/#34) + 4 channel cells = 14 total -- NOT the design doc's aspirational
# 16-boundary/20-cell S×C×M×A cube (there is no independently-buildable audio
# axis yet; see build_venvs.sh). The design's own trigger table (§3.2) is
# written against that 16/20-cell world ("PR-time: 6 boundary cells", "nightly:
# all 16 boundary cells", "weekly: 16 boundary + 4 channel + ..."); this
# divergence is expected and reported in the PR body -- the fix here scales
# the *shape* of the design's split (a fast PR lane, a fuller nightly lane, an
# everything weekly lane) onto today's 10+4 inventory, picking the highest-
# value subset for the fast lane rather than the literal cell names the
# design names (which don't exist yet):
#
#   | trigger                      | tier(s)              | cells run |
#   |-------------------------------|-----------------------|-----------|
#   | pull_request                  | pr-fast                | 6 (the 4 S/C aliases + the 2 highest-value matcher cells: old-skill/old-core-new-matchers and new-skill/new-core-old-matchers -- picked because they're the cheapest cells that still catch a matcher-axis regression on both skill vintages) |
#   | schedule 03:00 (nightly)      | boundary               | 10 (all boundary cells, incl. the 4 matcher-skew cells the PR-fast lane skips) |
#   | schedule 04:00 Sun (weekly)   | boundary + channel     | 14 (everything) |
#   | push: dev / workflow_dispatch | boundary + channel     | 14 (unchanged from before this split) |
#
# Channel cells stay off pull_request and nightly deliberately (design §3.2):
# they fetch live distro constraints, so a pin bump anywhere in the fleet
# should not turn an unrelated PR (or the nightly boundary-only run) red.
# Every `pr-fast` cell is also tagged `boundary`, so the nightly/weekly/push
# tiers still pick it up -- `tiers` is a list per cell (not a single `tier`
# string) precisely so a cell can belong to more than one selection set
# without being duplicated in ALL_CELLS.
#
# Scenario-level pruning (design §3.2's "scenarios 1, 4, and any scenario
# whose file the PR touched" at PR-time) is NOT implemented here: today's
# suite is one file (`test_mixed_version_matrix.py`) covering every
# scenario, not yet split one-file-per-scenario, so there is nothing to
# select by touched file. The existing per-cell axis pruning
# (`conftest.py`'s `pytest_collection_modifyitems`) is what currently keeps
# each cell's run down to its non-redundant scenarios; a scenario-by-file
# split is future work for whoever lands the full 16-cell matrix.
#
# The cell list itself stays single-sourced in the `generate-matrix` job
# below (one Python list), which every other trigger's cell selection reads
# from, rather than being duplicated per tier.

on:
  pull_request:
    paths:
      - 'test/backcompat/**'
      - '.github/workflows/backcompat_matrix.yml'
  push:
    branches:
      - dev
  schedule:
    # nightly: ALL boundary cells (10 today) -- deliberately larger than the
    # `pull_request` `pr-fast` lane above; this is where the 4 matcher-skew
    # cells the fast lane skips get their alarm.
    - cron: '0 3 * * *'
    # weekly: boundary + channel, the full cell set.
    - cron: '0 4 * * 0'
  workflow_dispatch:

# Read-only: this workflow makes no GitHub writes (no commit, no PR
# comment, no issue -- see the summarize job's own docstring), so the
# default token needs nothing beyond checking out the repo.
permissions:
  contents: read

jobs:
  generate-matrix:
    # Single source of the cell list (design §3.2's instruction: do not
    # duplicate the matrix block per tier). Every cell definition lives in
    # ALL_CELLS below, tagged with the tier(s) it belongs to; this job just
    # filters that one list by `github.event_name` (and, for `schedule`,
    # which cron fired) and hands the `matrix` job below a ready-made
    # `strategy.matrix` object via `fromJson`.
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.gen.outputs.cells }}
      combos: ${{ steps.gen.outputs.combos }}
    steps:
      - name: Select this run's cells by trigger tier
        id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          # `skill`/`core` are the venv-name arguments passed to
          # build_venvs.sh, and also which subdirectory of $RUNNER_TEMP/venvs
          # each one lands in: boundary venvs (venv_*_old/new) build directly
          # under $RUNNER_TEMP/venvs, channel venvs (venv_*_stable/testing)
          # build under $RUNNER_TEMP/venvs/channel — see build_venvs.sh's
          # header for why. `skill_dir`/`core_dir` spell out that path per
          # cell so the later steps don't need to re-derive it. `audio`
          # (venv_audio, T2.3/design §2.6) rides along on all four boundary
          # cells: it is a single behavioural venv (pins only
          # ovos-bus-client), not an old/new pair, so there is nothing to
          # cross it against here beyond running it. `tier` is this file's
          # own addition (not read by build_venvs.sh) -- it is what the
          # filter below selects on.
          # T2.7: each cell now carries a `tiers` LIST, not a single `tier`
          # string -- a cell can belong to more than one selection set (the
          # 6 PR-fast cells are also full boundary cells, so nightly/weekly/
          # push still run them; they are not duplicated in this list).
          ALL_CELLS = [
              {"combo": "old-skill/old-core", "skill": "venv_skill_old",
               "core": "venv_core_old", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs",
               "tiers": ["pr-fast", "boundary"]},
              {"combo": "old-skill/new-core", "skill": "venv_skill_old",
               "core": "venv_core_new", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs",
               "tiers": ["pr-fast", "boundary"]},
              {"combo": "new-skill/old-core", "skill": "venv_skill_new",
               "core": "venv_core_old", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs",
               "tiers": ["pr-fast", "boundary"]},
              {"combo": "new-skill/new-core", "skill": "venv_skill_new",
               "core": "venv_core_new", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs",
               "tiers": ["pr-fast", "boundary"]},
              # T2.5 -- the M (matcher) axis. ovos-core declares neither
              # matcher plugin as a runtime dependency, so the deployer
              # picks the padatious/adapt vintage independently of the core
              # vintage; these six cells are what make the matrix able to
              # attribute a red cell to the matcher package rather than to
              # ovos-core (design §2.4's S×C×M cube) -- see cells.py's
              # BOUNDARY_ALIASES for the matching cell ids. Two of the six
              # (below) are promoted into `pr-fast` too -- design §3.2's
              # rationale for a fast PR lane still wants matcher-axis
              # coverage on both skill vintages, cheaply; the other four
              # matcher/skew cells wait for the nightly `boundary` run.
              {"combo": "old-skill/new-core-old-matchers", "skill": "venv_skill_old",
               "core": "venv_core_new_matchers_old", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs", "tiers": ["boundary"]},
              {"combo": "new-skill/new-core-old-matchers", "skill": "venv_skill_new",
               "core": "venv_core_new_matchers_old", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs",
               "tiers": ["pr-fast", "boundary"]},
              {"combo": "old-skill/old-core-new-matchers", "skill": "venv_skill_old",
               "core": "venv_core_old_matchers_new", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs",
               "tiers": ["pr-fast", "boundary"]},
              {"combo": "new-skill/old-core-new-matchers", "skill": "venv_skill_new",
               "core": "venv_core_old_matchers_new", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs", "tiers": ["boundary"]},
              # skew sub-cells: ovos-padatious old, ovos-adapt-parser new,
              # on a current core. Design §2.2 scopes the skew's EFFECT to
              # the registration/dispatch scenario; these jobs still run
              # the whole suite like every other cell. The inverse skew
              # (padatious new, adapt old) is absent because it does not
              # co-resolve with either core pin -- see build_venvs.sh's
              # header for uv's verbatim refusal.
              {"combo": "old-skill/new-core-padatious-old-adapt-new", "skill": "venv_skill_old",
               "core": "venv_core_skew_padatious_old_adapt_new", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs", "tiers": ["boundary"]},
              {"combo": "new-skill/new-core-padatious-old-adapt-new", "skill": "venv_skill_new",
               "core": "venv_core_skew_padatious_old_adapt_new", "audio": "venv_audio",
               "skill_dir": "venvs", "core_dir": "venvs", "tiers": ["boundary"]},
              # channel cells: one side pinned by a live OVOS distro
              # constraints file (fetched fresh in build_venvs.sh), the
              # other at dev. These verify the fleet, not a boundary — see
              # test_mixed_version_matrix.py.
              {"combo": "stable-skill/dev-core", "skill": "venv_skill_stable",
               "core": "venv_core_new", "skill_dir": "venvs/channel",
               "core_dir": "venvs", "tiers": ["channel"]},
              {"combo": "dev-skill/stable-core", "skill": "venv_skill_new",
               "core": "venv_core_stable", "skill_dir": "venvs",
               "core_dir": "venvs/channel", "tiers": ["channel"]},
              {"combo": "testing-skill/dev-core", "skill": "venv_skill_testing",
               "core": "venv_core_new", "skill_dir": "venvs/channel",
               "core_dir": "venvs", "tiers": ["channel"]},
              {"combo": "dev-skill/testing-core", "skill": "venv_skill_new",
               "core": "venv_core_testing", "skill_dir": "venvs",
               "core_dir": "venvs/channel", "tiers": ["channel"]},
          ]

          # ALL_CELLS' own "tiers" values are a closed whitelist -- the
          # filter below only ever selects cells with at least one tier in
          # the `tiers` set built per-trigger further down, and every one of
          # those sets is drawn from {"pr-fast", "boundary", "channel"}. A
          # typo'd tier value on a new cell (e.g. "boundry") would match
          # none of those sets on ANY trigger, so the cell silently vanishes
          # from every run with exit 0 and zero signal -- an
          # adversarial-review finding from the original (single-tier)
          # version of this assert; still enforced under the list shape.
          # Assert the whitelist here, at collection time, so a bad tier
          # value fails the job loudly instead.
          _KNOWN_TIERS = {"pr-fast", "boundary", "channel"}
          _seen_tiers = {t for c in ALL_CELLS for t in c["tiers"]}
          assert _seen_tiers <= _KNOWN_TIERS, (
              f"unknown tier(s) in ALL_CELLS: {_seen_tiers - _KNOWN_TIERS}")

          event = os.environ["EVENT_NAME"]
          cron = os.environ.get("CRON", "")

          if event == "pull_request":
              # T2.7 fast lane: the 4 S/C aliases + the 2 highest-value
              # matcher cells (design §3.2's shape, scaled to today's 10+4
              # inventory -- see the file-header table).
              tiers = {"pr-fast"}
          elif event == "schedule" and cron == "0 3 * * *":
              # nightly: ALL boundary cells (10), including the 4
              # matcher/skew cells the PR-fast lane above skips.
              tiers = {"boundary"}
          elif event == "schedule" and cron == "0 4 * * 0":
              tiers = {"boundary", "channel"}
          else:
              # push:dev / workflow_dispatch / any other schedule: today's
              # unchanged behaviour, the full cell set.
              tiers = {"boundary", "channel"}

          selected = [
              {k: v for k, v in cell.items() if k != "tiers"}
              for cell in ALL_CELLS if set(cell["tiers"]) & tiers
          ]
          print(f"event={event!r} cron={cron!r} tiers={sorted(tiers)} "
                f"-> {len(selected)} cell(s): "
                f"{[c['combo'] for c in selected]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("cells=" + json.dumps({"include": selected}) + "\n")
              # The combo names selected for THIS run, independent of
              # whether the `matrix` job for each one ever produces a
              # findings artifact -- the `summarize` job diffs this
              # against what it actually downloaded, so a cell whose venv
              # build fails before pytest runs (no artifact at all, not
              # even an exitstatus) doesn't just vanish silently.
              fh.write("combos=" + json.dumps([c["combo"] for c in selected]) + "\n")
          PYEOF

  matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.cells) }}
    name: ${{ matrix.combo }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (padatious needs swig + libfann)
        run: sudo apt-get update && sudo apt-get install -y swig libfann-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build this cell's venvs
        env:
          BACKCOMPAT_PYTHON: "3.11"
        run: |
          chmod +x test/backcompat/build_venvs.sh
          test/backcompat/build_venvs.sh "$RUNNER_TEMP/venvs" "${{ matrix.skill }}" "${{ matrix.core }}" ${{ matrix.audio }}

      - name: Record the resolved versions
        run: |
          # Glob both the boundary dir and the channel subdir rather than
          # naming venvs, so a new cell (or a renamed one) is picked up here
          # automatically. Each job only ever has its own one or two venvs
          # present, since build_venvs.sh is now called with explicit names.
          for v in "$RUNNER_TEMP"/venvs/*/ "$RUNNER_TEMP"/venvs/channel/*/; do
            [ -d "$v" ] || continue
            name="$(basename "$v")"
            [ "$name" = "channel" ] && continue
            echo "== $name"
            "$v/bin/python" -m pip freeze 2>/dev/null || true
          done | tee venv-freeze.txt

      - name: Upload the resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venv-freeze-${{ strategy.job-index }}
          path: venv-freeze.txt

      # Channel cells only produce these, but the glob is harmless for the
      # boundary-pin cells. Kept so a red channel cell can be traced back to
      # exactly what the distro pinned that day.
      - name: Upload the fetched constraints files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constraints-${{ strategy.job-index }}
          path: ${{ runner.temp }}/venvs/channel/*.constraints.txt
          if-no-files-found: ignore

      - name: Run the combo
        env:
          BACKCOMPAT_COMBO: ${{ matrix.combo }}
        run: |
          export BACKCOMPAT_SKILL_PYTHON="$RUNNER_TEMP/${{ matrix.skill_dir }}/${{ matrix.skill }}/bin/python"
          # Channel cells don't get an `audio` entry (empty string), so this
          # only lands for the four boundary cells -- see the matrix comment
          # above.
          if [ -n "${{ matrix.audio }}" ]; then
            export BACKCOMPAT_AUDIO_PYTHON="$RUNNER_TEMP/venvs/${{ matrix.audio }}/bin/python"
          fi
          "$RUNNER_TEMP/${{ matrix.core_dir }}/${{ matrix.core }}/bin/pytest" \
            test/backcompat/ -v --tb=short -rxX \
            --timeout=300 --timeout-method=thread

      # test/backcompat/conftest.py's pytest_terminal_summary writes
      # backcompat-findings-<cell>.json into the job's working directory
      # (design §4.2) whenever BACKCOMPAT_COMBO was set -- i.e. every run of
      # this step, `if: always()` so a job that failed (a genuine
      # regression, not an expected xfail) still uploads what it saw.
      - name: Upload the findings feed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backcompat-findings-${{ strategy.job-index }}
          path: backcompat-findings-*.json
          if-no-files-found: warn

  summarize:
    needs: [generate-matrix, matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # One artifact per matrix job (named backcompat-findings-<job-index>,
      # see the upload step above); merge-multiple flattens them all into
      # one directory rather than one subdirectory per artifact, since this
      # job only cares about the union of every *.json file, not which job
      # produced which.
      - name: Download every cell's findings
        uses: actions/download-artifact@v4
        with:
          pattern: backcompat-findings-*
          path: findings
          merge-multiple: true

      # Purely informational (design §4.2): reads the downloaded JSON,
      # groups by BOUNDARY (not cell -- a boundary is the unit of work),
      # writes FINDINGS/SPRINT.md, echoes it into the step summary, and
      # makes NO GitHub writes (no commit, no PR comment, no issue). Inline
      # per design §4.2's own preference, to keep this logic out of
      # test/backcompat/ (which is scoped to test-time concerns, not CI
      # reporting).
      - name: Render FINDINGS/SPRINT.md
        env:
          SUMMARY_DATE: ${{ github.event.head_commit.timestamp }}
          EXPECTED_COMBOS: ${{ needs.generate-matrix.outputs.combos }}
        run: |
          # Fall back to `date -u` if SUMMARY_DATE above resolved to
          # nothing (e.g. a workflow_dispatch/schedule run has no
          # head_commit) -- a real timestamp is always available as the
          # guaranteed fallback.
          export SUMMARY_DATE="${SUMMARY_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          from collections import defaultdict

          # Each findings file is now an object, {"cell", "combo",
          # "exitstatus", "records"} (see test/backcompat/findings.py's
          # write_findings) -- exitstatus is what lets a cell that died at
          # collection (e.g. an import-time assert) be told apart from a
          # clean run, since both used to write the same bare `[]`.
          # Old-shape files (a bare list) are still accepted -- treated as
          # records with unknown exitstatus -- so a mixed-vintage findings
          # download never crashes this step.
          #
          # `cells_red` (exitstatus == 1, real test failures -- the cell
          # DID complete, pytest just found a genuine regression) and
          # `did_not_complete` (exitstatus is None/unknown or >= 2, i.e.
          # the run itself never produced a normal pass/fail result --
          # collection errors, crashes, timeouts) are reported as two
          # separate sections: a red cell is signal a maintainer should
          # act on immediately, a cell that never finished is a
          # "the matrix ran blind here" gap -- conflating the two under one
          # heading was itself a reviewed defect (both used `exitstatus not
          # in (0, None)`, which put ordinary test failures in the same
          # bucket as collection deaths).
          records = []
          cells_red = []
          did_not_complete = []
          found_combos = set()
          for path in sorted(glob.glob("findings/backcompat-findings-*.json")):
              with open(path) as f:
                  try:
                      payload = json.load(f)
                  except json.JSONDecodeError as e:
                      print(f"::warning::{path}: not valid JSON ({e}), skipping")
                      continue
              if isinstance(payload, list):
                  # old shape: bare records list, exitstatus/combo unknown.
                  records.extend(payload)
                  continue
              cell = payload.get("cell") or os.path.basename(path)
              combo = payload.get("combo")
              if combo:
                  found_combos.add(combo)
              exitstatus = payload.get("exitstatus")
              records.extend(payload.get("records") or [])
              if exitstatus == 1:
                  cells_red.append((cell, exitstatus, path))
              elif exitstatus is None or (isinstance(exitstatus, int) and exitstatus >= 2):
                  did_not_complete.append((cell, exitstatus, path))

          # FIX (adversarial re-review): a cell whose venv build fails
          # before pytest ever runs produces NO findings file at all --
          # `download-artifact` with `pattern:` succeeds on zero matches,
          # so that cell was previously invisible everywhere, including
          # this "did not complete" accounting. `generate-matrix`'s own
          # `combos` output (the combo names it selected for THIS run,
          # independent of whether the matrix job for each one ever
          # produced an artifact) is what lets this step notice a combo
          # nothing was ever uploaded for.
          expected_combos = set(json.loads(os.environ.get("EXPECTED_COMBOS", "[]")))
          for combo in sorted(expected_combos - found_combos):
              did_not_complete.append((combo, "no artifact", "<none uploaded>"))

          xpass = [r for r in records if r.get("outcome") == "xpass"]
          xfail = [r for r in records if r.get("outcome") == "xfail"]

          by_boundary = defaultdict(lambda: {
              "axes": set(), "cells": set(), "scenarios": set(),
              "blocked_on": set(), "owner": set(),
          })
          for r in xfail:
              key = r.get("boundary") or "<unlabeled boundary>"
              entry = by_boundary[key]
              entry["axes"].update(r.get("axes") or [])
              entry["cells"].add(r.get("cell") or "<unknown cell>")
              entry["scenarios"].add(r.get("scenario") or "<unknown scenario>")
              if r.get("blocked_on"):
                  entry["blocked_on"].add(r["blocked_on"])
              if r.get("owner"):
                  entry["owner"].add(r["owner"])

          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', '')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID', '')}"
          )
          date = os.environ.get("SUMMARY_DATE", "")

          lines = []
          lines.append(f"# back-compat matrix — sprint input (generated {date}, run {run_url})")
          lines.append("")
          lines.append("## Cells red")
          lines.append("")
          if cells_red:
              lines.append("| cell | exitstatus | findings file |")
              lines.append("|---|---|---|")
              for cell, exitstatus, path in sorted(cells_red, key=lambda t: (t[0], str(t[1]))):
                  lines.append(f"| {cell} | {exitstatus} | {path} |")
          else:
              lines.append("None this run -- no cell exited with a genuine test failure.")
          lines.append("")
          lines.append("## Cells that did not complete")
          lines.append("")
          if did_not_complete:
              lines.append("| cell | exitstatus | findings file |")
              lines.append("|---|---|---|")
              for cell, exitstatus, path in sorted(did_not_complete, key=lambda t: (t[0], str(t[1]))):
                  lines.append(f"| {cell} | {exitstatus} | {path} |")
          else:
              lines.append("None this run -- every selected cell produced a normal pass/fail result.")
          lines.append("")
          lines.append("## XPASS — a fix shipped, drop the marker")
          lines.append("")
          if xpass:
              lines.append("| cell | scenario | boundary | what to do |")
              lines.append("|---|---|---|---|")
              for r in xpass:
                  lines.append(
                      f"| {r.get('cell', '')} | {r.get('scenario', '')} | "
                      f"{(r.get('boundary') or '').replace(chr(10), ' ')} | "
                      "drop the xfail marker |")
          else:
              lines.append("None this run.")
          lines.append("")
          lines.append("## Red boundaries")
          lines.append("")
          if by_boundary:
              lines.append("| boundary | axes | cells red | scenarios | blocked on | owner |")
              lines.append("|---|---|---|---|---|---|")
              def _scrub(s):
                  return s.replace("|", "\\|").replace(chr(10), " ")

              for boundary, entry in sorted(by_boundary.items()):
                  scenarios = "; ".join(sorted(entry["scenarios"]))
                  blocked_on = "; ".join(sorted(entry["blocked_on"])) or "—"
                  owner = "; ".join(sorted(entry["owner"])) or "—"
                  lines.append(
                      f"| {_scrub(boundary)} | {','.join(sorted(entry['axes']))} | "
                      f"{len(entry['cells'])} | "
                      f"{_scrub(scenarios)} | "
                      f"{_scrub(blocked_on)} | "
                      f"{_scrub(owner)} |")
          else:
              lines.append("No red boundaries this run.")

          out = "\n".join(lines) + "\n"
          os.makedirs("FINDINGS", exist_ok=True)
          with open("FINDINGS/SPRINT.md", "w") as f:
              f.write(out)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(out)

          print(out)
          PYEOF

      - name: Upload FINDINGS/SPRINT.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backcompat-sprint-findings
          path: FINDINGS/SPRINT.md
          if-no-files-found: warn
