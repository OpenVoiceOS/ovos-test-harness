[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    axes(*names): declares which back-compat axes (S/C/M/A, see
        test/backcompat/cells.py and design doc §2.4) this scenario
        crosses. test/backcompat/conftest.py deselects the test when every
        named axis is at reference ("new") vintage for the current cell.
    known_red_tripwire: the one test in a known-red cell
        (test/backcompat/cells.py KNOWN_RED_CELLS) that runs without the
        cell-wide xfail, so it fails when the recorded reason stops being
        true.
